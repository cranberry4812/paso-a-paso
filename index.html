<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Paso a Paso: a free bilingual English and early-technology program for children ages 4 to 7." />
    <title>Paso a Paso</title>
    <link rel="stylesheet" href="/src/styles/base.css" />

      <h1>Hola, I'm Cami!</h1>
